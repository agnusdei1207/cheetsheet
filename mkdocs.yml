site_name: cheetsheet
site_description: 침투 테스트 치트시트 모음
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  features:
    - content.code.copy
    - navigation.expand
    - search.highlight

markdown_extensions:
  - fenced_code
  - tables
  - admonition
  - toc:
      permalink: false
