site_name: Cheatsheet
site_description: Penetration testing cheatsheets collection
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.expand
    - search.highlight

markdown_extensions:
  - fenced_code
  - tables
  - admonition
  - toc:
      permalink: false
