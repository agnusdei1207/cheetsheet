site_name: cheetsheet
site_description: 침투 테스트 치트시트 모음
docs_dir: .
site_dir: site

# 저장소 자체 파일은 사이트에서 제외
exclude_docs: |
  /.git/
  /.github/
  /site/
  /mkdocs.yml
  /.gitignore

theme:
  name: material
  language: ko
  features:
    - content.code.copy
    - navigation.expand
    - search.highlight

markdown_extensions:
  - fenced_code
  - tables
  - admonition
  - toc:
      permalink: false
